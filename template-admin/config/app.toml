#:schema https://summer-rs.github.io/config-schema.json

[web]
port = 8080
graceful = true
one_indexed = false
max_page_size = 2000
default_page_size = 20
global_prefix = "api"

# 请求体大小上限（附件上传）
# - 附件中心业务上限 50MB（AttachmentService::MAX_FILE_SIZE），此处放宽到 64MB：
#   超限时由业务层返回中文 JSON 错误，而不是被框架层 413 纯文本拦截；
# - 不配置此项时走 axum 默认 2MB，会导致 >2MB 的图片上传直接失败。
[web.middlewares]
limit_payload = { enable = true, body_limit = "64MB" }

[sea-orm-ext]
uri = "${DATABASE_URL:postgres://postgres:root@localhost:5432/template2}"
min_connections = 1
max_connections = 10
enable_sql_log = true
default_user = "system"

[sa-token]
token_name = "Authorization"
timeout = 86400
auto_renew = true
token_style = "Jwt"
jwt_secret_key = "${JWT_SECRET_KEY:please-change-me-in-production}"
jwt_algorithm = "HS256"
storage_key_prefix = "template"
enable_refresh_token = true
refresh_token_timeout = 604800
# 同账号并发会话上限：sa-token 默认 is_concurrent=true + max_login_count=-1（不限制），
# 每次登录都会向 login:tokens / session / refresh:user 三类"永久"索引键追加条目，
# 而它们只在显式登出时才会缩减 —— 不设上限会导致 Redis 随登录次数无界膨胀。
# 超过上限时按 overflow_logout_mode 处理（Logout = 彻底登出最旧会话，连带清理其索引与 refresh token）。
is_concurrent = true
max_login_count = 1
overflow_logout_mode = "Logout"

[redis]
uri = "redis://localhost:6379"

[sea-orm-ext-tenant]
enabled = true
mode = "${TENANT_MODE:table}"
default_tenant_id = "1876543210000000001"
tenant_id_header = "x-tenant-id"
ignore_if_missing = true
database_source = "config"

[[sea-orm-ext-tenant.databases]]
tenant_id = "1876543210000000001"
[sea-orm-ext-tenant.databases.database]
url = "postgres://postgres:root@localhost:5432/template"
max_connections = 10
min_connections = 1

[[sea-orm-ext-tenant.databases]]
tenant_id = "1876543210000000002"
[sea-orm-ext-tenant.databases.database]
url = "postgres://postgres:root@localhost:5432/template"
max_connections = 10
min_connections = 1

# 动态租户管理：启动时从主库 auth_sys_tenant 加载 database 模式租户并建立连接，
# 运行时由 TenantManager 增删改租户并同步缓存。
# 仅在 tenant mode = "database" 时生效。
[sea-orm-ext-dynamic-tenant]
enabled = true
health_check_interval_secs = 60
health_check_failure_threshold = 3
auto_remove_on_failure = true

# ===== 统一附件管理存储 =====
# driver 可选值：
#   - "local"    本地磁盘（开发/单机场景）
#   - "rustfs"   RustFS 对象存储（S3 兼容 API，生产/分布式场景）
[attachment.storage]
driver = "local"
local_path = "./uploads/attachment"
rustfs_endpoint = "http://localhost:9000"
rustfs_bucket = "template"
rustfs_access_key = ""
rustfs_secret_key = ""
rustfs_region = "us-east-1"
rustfs_secure = false

# ===== 邮件服务器（summer-mail 插件按 [mail] 自动装配 SMTP 客户端）=====
# stub = true 时不联网发送、仅打日志（本地联调用）；真实环境保持 false。
[mail]
host = "smtp.example.com"
port = 465
secure = true
test_connection = false
stub = true

[mail.auth]
user = ""
password = ""

[common]
default_user = "system"
