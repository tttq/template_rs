#:schema https://summer-rs.github.io/config-schema.json

[web]
port = 8080
graceful = true
one_indexed = false     # 基于1的索引，默认关闭
max_page_size = 2000    # 支持的最大页大小，避免服务器攻击出现OOM，默认值2000
default_page_size = 20  # 默认页大小，20

[summer-sea-orm-ext]
uri = "${DATABASE_URL:postgres://postgres:root@localhost:5432/template}"
min_connections = 1
max_connections = 10
enable_sql_log = true
default_user = "system"

[sa-token]
token_name = "Authorization"
timeout = 86400
auto_renew = true
token_style = "Jwt"
jwt_secret_key = "${JWT_SECRET_KEY:please-change-me-in-production}"
jwt_algorithm = "HS256"
storage_key_prefix = "template"
enable_refresh_token = true
refresh_token_timeout = 604800

[redis]
uri = "redis://localhost:6379"

[summer-sea-orm-ext-tenant]
enabled = true
mode = "${TENANT_MODE:table}"
default_tenant_id = "1876543210000000001"
tenant_id_header = "x-tenant-id"
ignore_if_missing = true
database_source = "config"

[[summer-sea-orm-ext-tenant.databases]]
tenant_id = "1876543210000000001"
[summer-sea-orm-ext-tenant.databases.database]
url = "postgres://postgres:root@localhost:5432/template"
max_connections = 10
min_connections = 1

[[summer-sea-orm-ext-tenant.databases]]
tenant_id = "1876543210000000002"
[summer-sea-orm-ext-tenant.databases.database]
url = "postgres://postgres:root@localhost:5432/template"
max_connections = 10
min_connections = 1

# 动态租户管理：启动时从主库 auth_sys_tenant 加载 database 模式租户并建立连接，
# 运行时由 TenantManager 增删改租户并同步缓存（替代手动 store.insert/remove）。
# 仅在 tenant mode = "database" 时生效。
[summer-sea-orm-ext-dynamic-tenant]
enabled = true
health_check_interval_secs = 60
health_check_failure_threshold = 3
auto_remove_on_failure = true

[storage]
enabled = false
provider = "minio"

[common]
default_user = "system"
